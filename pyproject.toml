[project]
name = "digitalcoach"
version = "0.1.0"
description = "AI-powered calisthenics workout-video technique analysis API"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: calling Depends()/File()/Form() in argument defaults is the FastAPI idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
